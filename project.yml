# XcodeGen 工程定义（xcodegen generate）。.xcodeproj 不入库。
name: Couli
options:
  bundleIdPrefix: com.couli
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: false

# 三套构建配置（03 §3.6）。
# Staging 用 debug 类型（XcodeGen 按 debug 预设生成调试符号等设置）；App target 在 Debug、Staging 都定义
# DEBUG，Staging 另外定义 STAGING（默认环境 staging、显示名），并开 -O 优化，让测试包的性能接近正式包。
#
# 本地 SPM 包看不到 Staging 的 DEBUG（Xcode 27 实测，见 notes）：Xcode 只给包准备 Debug / Release
# 两套配置，工程配置名不含 "debug"（不区分大小写）时一律按包的 Release 编译（-O、不定义 DEBUG）；
# 工程级 settings / configFiles 管不到包。配置名必须叫 Staging，所以约定：
#   - 只在 Debug / Staging 存在的调试能力（环境列表与非 prod 地址、环境切换、DebugCapabilities、
#     调试面板、debug_only 路由表 DebugOnlyRoutes）一律放在 App target 的源码里用 #if DEBUG 包住；
#   - 包里（Core / DesignSystem / Features）不写 #if DEBUG（swiftlint 规则 no_debug_condition_in_packages）；
#     Generated 包的 Routes.all 仍按契约在 #if DEBUG 里登记 debug_only 路由（Debug 构建与包测试用）。
# 这样普通的 `xcodebuild -configuration Staging` 和 Xcode 里选 Staging 都得到带调试能力的测试包，
# 不需要任何额外参数（verify.sh 有一步专门验证，并在 Staging 包里找调试面板标记）。
configs:
  Debug: debug
  Staging: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Generated:
    path: Packages/Generated
  Core:
    path: Packages/Core
  DesignSystem:
    path: Packages/DesignSystem
  Features:
    path: Packages/Features
  # 首页视觉（APP-11v）的 App / UI 整页快照：与 Features/HomeTests 同一个现有测试库、同一精确版本，只加到两个测试 target。
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  Couli:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    configFiles:
      Debug: App/Config/Debug.xcconfig
      Staging: App/Config/Staging.xcconfig
      Release: App/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: Couli
        TARGETED_DEVICE_FAMILY: "1"  # 只做 iPhone；iPad 以 iPhone 兼容模式运行（01 §7.5）
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        # 资源目录：系统启动屏底色 LaunchBackground（APP-02b，= 令牌 background.canvas）与 App 图标 AppIcon（BRAND-01：
        # 单尺寸 1024 universal，Any / Dark / Tinted 三个外观：Any = icon-default，Dark = icon-dark，Tinted = icon-dark 的构图按亮度
        # 转灰阶（深底浅图形，与系统着色图标约定一致；icon-tinted 是浅底深图形，只作单色识别检查，见 design/app-icon/README.md），着色由系统完成）。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Info.plist 手写并经 C 预处理（APP-02a）：测试用深链 scheme 只在 Debug / Staging 声明，
        # Release 的 Info.plist 里没有 CFBundleURLTypes（占位 scheme 不进正式包，needs N-05）。
        # XcodeGen 的 info.properties 不能按配置增删键，所以不再由它生成 App/Info.plist。
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_PREPROCESS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          # COULI_DEBUG_LOOPBACK：本机桥一致性页（http://127.0.0.1）的 ATS 例外，只在 Debug（APP-04；Staging、Release 没有）。
          INFOPLIST_PREPROCESSOR_DEFINITIONS: COULI_DEBUG_DEEPLINK=1 COULI_DEBUG_LOOPBACK=1
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG STAGING
          SWIFT_OPTIMIZATION_LEVEL: -O
          INFOPLIST_PREPROCESSOR_DEFINITIONS: COULI_DEBUG_DEEPLINK=1
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: App/Couli.entitlements
      properties: {}
    dependencies:
      # 先跑 Feature 隔离检查（每次构建都执行），失败则整个构建失败。
      - target: FeatureIsolationCheck
        link: false
        embed: false
      - package: Generated
      - package: Core
        products: [Config, Router, Privacy, Update, CouliNetwork, Session, SecureStore, ClientCore, BridgeHost, ProductSearch,
                   TradeJump, Trade, Clipboard, OrderCore, MeCore, Push, HomeCore]
      - package: DesignSystem
      - package: Features
        products: [Home, Search, Product, Agent, Orders, Wallet, Me, Auth, Web, Login, Purchase]

  CouliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
        excludes:
          - "**/__Snapshots__"
          # FU-IOS-A11Y-CODE-ERROR-FOCUS（D10-1432）：未自动验证的读屏用例，不进必跑名单（恢复时删这一行）
          - "Pending/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couli.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Couli
      - package: SnapshotTesting

  CouliUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes:
          - "**/__Snapshots__"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.couli.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        # FU-IOS-0712（F-IOS-10）：包载入时登记每用例总上限（UITests/UITestWaits.swift 的 UITestTimeouts）
        INFOPLIST_KEY_NSPrincipalClass: CouliUITestTimeouts
        # APP-11v：SnapshotTesting 的模块按条件 import Testing；Xcode 给 UI 测试 target 默认把 Testing 别名成不可用模块
        # （TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS = -module-alias Testing=_Testing_Unavailable），载入 SnapshotTesting 会失败。
        # 只对这个 target 清掉别名；UI 测试本身仍只用 XCTest。
        TESTING_FRAMEWORK_MODULE_ALIAS_FLAGS: ""
    dependencies:
      - target: Couli
      - package: SnapshotTesting

schemes:
  Couli:
    build:
      targets:
        Couli: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      # FU-IOS-TESTMANAGERD-LOST（D10-1447）：UI 测试自动抓屏改截图，不再录视频。
      # 默认 screenRecording 时模拟器里的 testmanagerd 在停止录屏处崩溃、xcodebuild 报 Lost connection to testmanagerd。
      # 失败用例仍留自动截图附件（systemAttachmentLifetime 保持默认 deleteOnSuccess）。
      preferredScreenCaptureFormat: screenshots
      targets:
        - CouliTests
        - CouliUITests
        - package: Generated/GeneratedTests
        - package: Core/ConfigTests
        - package: Core/RouterTests
        - package: Core/PrivacyTests
        - package: Core/UpdateTests
        - package: Core/NetworkTests
        - package: Core/ClientCoreTests
        - package: Core/BridgeHostTests
        - package: Core/ClipboardTests
        - package: Core/OrderCoreTests
        - package: Core/WalletCoreTests
        # APP-12：Codex 先写的 Me 向量测试与执行器测试（APP-09 曾漏登记导致向量测试不跑，这里登记）
        - package: Core/MeCoreTests
        # APP-11：首页 SDUI（向量、本机存储、执行器）与首页 golden 截图（测试作者先写；实现方在 Core / Features 的 Package.swift 加对应 target）
        - package: Core/HomeCoreTests
        - package: Features/HomeTests
        - package: DesignSystem/DesignSystemTests
        - package: Features/LoginTests
        - package: Features/SearchTests
        - package: Features/TradeTests
        - package: Features/OrdersTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

aggregateTargets:
  # 每次构建 Couli 都运行：Feature 之间不能互相 import（理由见 tools/ci/check-feature-imports.py 头注释）。
  # 与 verify.sh 走同一个脚本：导入列表由 swiftc -frontend -emit-imported-modules 解析得出，编译器出错即构建失败。
  # 脚本要读整个 Packages/Features/Sources 目录树，构建脚本沙盒只放行逐个声明的输入文件
  # （实测：声明目录本身时子目录读不到），所以只对这个只读检查的聚合 target 关闭沙盒；App target 保持开启。
  FeatureIsolationCheck:
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    buildScripts:
      - name: Check Feature isolation
        basedOnDependencyAnalysis: false
        script: |
          /usr/bin/python3 "${SRCROOT}/tools/ci/check-feature-imports.py" "${SRCROOT}/Packages/Features/Sources"
